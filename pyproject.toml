[project]
name = "jev-rerank-bench"
version = "0.1.0"
description = "Reproducible reranking benchmark: TypeSafe Jev vs Cohere Rerank 4 vs ZeroEntropy zerank-2 vs a single-token LLM baseline vs BM25"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "bm25s>=0.2.7",
    "PyStemmer>=2.2",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
    "numpy>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
